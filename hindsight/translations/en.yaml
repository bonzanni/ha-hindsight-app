configuration:
  openrouter_api_key:
    name: OpenRouter API Key
    description: Your OpenRouter API key (required for the reasoning LLM).
  llm_model:
    name: Reasoning Model
    description: >-
      OpenRouter model id used for Hindsight's reasoning steps (fact extraction
      on retain, dialectic/reflect on recall). The best choice is workload-
      dependent; tune it after integrating with your agent.
  llm_reasoning_effort:
    name: Reasoning Effort
    description: Effort hint for models that support it (low is fastest).
  reranker_enabled:
    name: Enable Reranker
    description: >-
      Run the local cross-encoder reranker for higher-quality recall. Disable
      to shave latency off the recall path on low-power hosts.
  enable_ui:
    name: Enable Control-Plane UI
    description: >-
      Serve the Hindsight memory-browser UI in the sidebar. Disable for a
      headless, API-only deployment with a smaller memory footprint.
  recency_decay:
    name: Recency Decay
    description: >-
      How a memory's age nudges recall ranking (at most +/-10%, as a
      tie-breaker between similarly relevant memories). exponential favours
      the last few weeks; linear spreads the effect evenly over a window;
      none disables it.
  recency_halflife_days:
    name: Recency Half-Life (days)
    description: >-
      For exponential decay, the age at which a memory gets no recency
      boost or penalty. Shorter values favour recent state more strongly.
  recency_linear_window_days:
    name: Recency Window (days)
    description: >-
      For linear decay, the number of days over which the boost falls to its
      minimum. Memories older than that all rank the same on recency.
  log_level:
    name: Log Level
    description: Application log verbosity.
